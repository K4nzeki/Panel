name: panel
description: Panel — track the manga, manhwa, manhua and comics you read.
publish_to: "none"
# Version: MAJOR.MINOR.PATCH+BUILD — bump it in every release.
#   Major update (big redesign, breaking change)  → +1.0.0  e.g. 2.1.1 → 3.0.0
#   Minor update (new feature)                    → +0.1.0  e.g. 2.1.1 → 2.2.0
#   Bugs fixed only                               → +0.0.1  e.g. 2.1.1 → 2.1.2
# A bigger bump resets the numbers after it to 0.
# BUILD (after +) always goes up by 1, whatever changed: Android won't
# install an update over a build with the same or a higher number.
# See "Versioning" in README.md.
version: 2.1.1+12

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  file_picker: ^13.4.1
  archive: ^4.0.4
  # Reads extension sites' pages: chapters, page images, missing covers.
  html: ^0.15.5
  # New-chapter checks in the background + notifications.
  workmanager: ^0.10.3
  # Pinned below 20: newer versions need compileSdk 37 / AGP 9.1.
  flutter_local_notifications: ^23.0.4
  # Where downloaded chapters, saved chapter lists and repo copies live.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# App icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/logo_foreground.png
