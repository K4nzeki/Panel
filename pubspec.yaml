name: panel
description: MyReadList — track the manga, manhwa, manhua and comics you read.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^3.5.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# App icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/logo_foreground.png
